plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mocapstudio.camera'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.mocapstudio.camera'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    // Fixed debug key shipped with the project: any PC that builds this can update an installed copy.
    // Test tool only - not a release key.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Java 17, as Harpia's verified Android consumer (the generated jar is Java 17 bytecode).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // android.jar stubs return defaults (0, null) in JVM tests instead of throwing.
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            systemProperty 'fixtures', "${rootDir}/third_party/mocap-contracts/fixtures"
        }
    }
}

// Messages generated by Harpia, from mocap-contracts (submodule). Its gen/java project is built into a jar
// first (./dev contracts), and the app takes only the subset Harpia documents for Android
// (HarpiaTest/app_example/android_consumer): message classes, JSON, the JeroMQ client. Its DB, REST, SOAP
// and gRPC parts ride along in the jar but are never used, so their runtimes are not added.
def contractsJars = fileTree(dir: "${rootDir}/third_party/mocap-contracts/gen/java/build/libs", include: ['*.jar'])
if (contractsJars.isEmpty()) {
    throw new GradleException('mocap-contracts jar missing: run ./dev contracts (git submodule update --init first)')
}

dependencies {
    implementation contractsJars
    // Versions in lockstep with third_party/mocap-contracts/gen/java/build.gradle.
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.3'
    implementation 'org.zeromq:jeromq:0.6.0'

    testImplementation 'junit:junit:4.13.2'
}
