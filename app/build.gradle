plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mocapstudio.camera'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.mocapstudio.camera'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    // Fixed debug key shipped with the project: any PC that builds this can update an installed copy.
    // Test tool only - not a release key.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // android.jar stubs return defaults (0, null) in JVM tests instead of throwing.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
